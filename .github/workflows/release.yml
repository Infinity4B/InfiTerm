name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run checks
        run: |
          go vet ./...
          go test -race ./...

      - name: Build release archives
        run: |
          VERSION="${{ steps.meta.outputs.tag }}"
          mkdir -p dist
          for arch in arm64 amd64; do
            stage="dist/stage-${arch}"
            mkdir -p "$stage"
            GOOS=darwin GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${stage}/infiterm" .
            cp README.md targets.example.json "$stage/"
            tar -czf "dist/infiterm-${VERSION}-darwin-${arch}.tar.gz" -C "$stage" .
            rm -rf "$stage"
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt)
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
              --title "InfiTerm ${TAG}" \
              --generate-notes
          fi
