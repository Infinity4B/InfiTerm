<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porthole</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    {
      "imports": {
        "@xterm/xterm": "/vendor/xterm.mjs",
        "@xterm/addon-fit": "/vendor/addon-fit.mjs",
        "@xterm/addon-web-links": "/vendor/addon-web-links.mjs",
        "@xterm/addon-webgl": "/vendor/addon-webgl.mjs"
      }
    }
  </script>
</head>
<body>
  <header class="tabbar">
    <div id="tabs" class="tabs" role="tablist"></div>
    <button id="btn-new" class="icon-btn" data-i18n-title="btn.new">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="spacer"></div>
    <button id="btn-composer" class="icon-btn" data-i18n-title="btn.composer" aria-pressed="false">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></svg>
    </button>
    <button id="btn-appearance" class="icon-btn"></button>
    <button id="btn-settings" class="icon-btn" data-i18n-title="btn.settings">
      <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <main id="panes" class="panes"></main>

  <section id="home" class="home" hidden>
    <h1>Porthole</h1>
    <p class="muted" data-i18n-html="home.hint"></p>
    <div id="home-list" class="target-list"></div>
  </section>

  <footer class="composer" id="composer">
    <div class="composer-meta">
      <span id="meta-target" class="meta-target"></span>
      <span id="meta-mode" class="meta-mode"></span>
    </div>
    <div class="composer-row">
      <span class="prompt-mark">❯</span>
      <div class="editor">
        <div id="ghost" class="editor-text ghost" aria-hidden="true"><span id="ghost-typed"></span><span id="ghost-hint" class="ghost-hint"></span></div>
        <textarea id="input" class="editor-text" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off"
          data-i18n-placeholder="composer.placeholder"></textarea>
      </div>
    </div>
  </footer>

  <dialog id="picker" class="picker">
    <input id="picker-filter" type="text" data-i18n-placeholder="picker.placeholder" autocomplete="off" spellcheck="false">
    <div id="picker-list" class="target-list"></div>
  </dialog>

  <dialog id="settings" class="settings">
    <form id="settings-form" method="dialog">
      <h2 data-i18n="settings.title"></h2>
      <div class="field">
        <label for="font-input" data-i18n="settings.font"></label>
        <div class="combo">
          <input id="font-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="font-options"
            autocomplete="off" spellcheck="false" data-i18n-placeholder="settings.fontSearch">
          <div id="font-options" class="combo-list" role="listbox" hidden></div>
        </div>
      </div>
      <div class="font-row"><span id="font-status" class="muted"></span></div>
      <div class="grid2">
        <label class="field">
          <span data-i18n="settings.language"></span>
          <select name="language">
            <option value="auto" data-i18n="language.auto"></option>
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="settings.appearance"></span>
          <select name="appearance">
            <option value="system" data-i18n="appearance.system"></option>
            <option value="light" data-i18n="appearance.light"></option>
            <option value="dark" data-i18n="appearance.dark"></option>
          </select>
        </label>
        <label class="field"><span data-i18n="settings.fontSize"></span><input name="fontSize" type="number" min="8" max="40" step="1"></label>
        <label class="field"><span data-i18n="settings.uiFontSize"></span><input name="uiFontSize" type="number" min="10" max="32" step="1"></label>
        <label class="field"><span data-i18n="settings.lineHeight"></span><input name="lineHeight" type="number" min="1" max="2.5" step="0.05"></label>
        <label class="field"><span data-i18n="settings.letterSpacing"></span><input name="letterSpacing" type="number" min="-2" max="10" step="0.5"></label>
        <label class="field">
          <span data-i18n="settings.fontWeight"></span>
          <select name="fontWeight">
            <option value="300" data-i18n="weight.300"></option>
            <option value="normal" data-i18n="weight.normal"></option>
            <option value="500" data-i18n="weight.500"></option>
            <option value="600" data-i18n="weight.600"></option>
            <option value="bold" data-i18n="weight.bold"></option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="settings.cursorStyle"></span>
          <select name="cursorStyle">
            <option value="block" data-i18n="cursor.block"></option>
            <option value="bar" data-i18n="cursor.bar"></option>
            <option value="underline" data-i18n="cursor.underline"></option>
          </select>
        </label>
        <label class="field"><span data-i18n="settings.scrollback"></span><input name="scrollback" type="number" min="1000" max="200000" step="1000"></label>
      </div>
      <label class="check"><input name="cursorBlink" type="checkbox"> <span data-i18n="settings.cursorBlink"></span></label>
      <label class="check"><input name="macOptionIsMeta" type="checkbox"> <span data-i18n="settings.macOptionIsMeta"></span></label>
      <label class="check"><input name="showComposer" type="checkbox"> <span data-i18n="settings.showComposer"></span></label>
      <div class="actions">
        <button type="button" id="btn-reset" class="tool-btn" data-i18n="settings.reset"></button>
        <button class="primary-btn" data-i18n="settings.done"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
